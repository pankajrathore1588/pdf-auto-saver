<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Auto Saver</title>
<style>body{font-family:Arial;background:#f4f6f8;padding:35px}.card{max-width:850px;margin:auto;background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ccd3da;border-radius:10px;font-size:16px}button{margin-top:12px;padding:13px 20px;border:0;border-radius:10px;background:#111827;color:white;font-size:16px}.status{margin:18px 0;padding:12px;border-radius:10px;background:#eef2ff}.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}</style></head>
<body><div class="card"><h1>📚 PDF Auto Saver</h1><p>Login once. Open PDFs normally. They are saved automatically.</p>
<input id="url" value="https://" placeholder="https://your-website.com"><button onclick="openBrowser()">Open Website in Browser</button>
<div id="status" class="status">Starting...</div><h2>PDFs saved: <span id="count">0</span></h2><div id="list"></div></div>
<script>
async function openBrowser(){let u=document.getElementById('url').value.trim();let r=await fetch('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})});let d=await r.json();document.getElementById('status').textContent=d.message||d.error}
async function refresh(){try{let d=await (await fetch('/api/session')).json();count.textContent=d.count;list.innerHTML=d.items.map(x=>`<div class="item"><span>${x.filename} (${Math.round(x.size/1024)} KB)</span><a href="${x.url}">Save copy</a></div>`).join('')}catch(e){}}
setInterval(refresh,1500);refresh()
</script></body></html>
